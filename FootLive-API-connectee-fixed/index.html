<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d18"><link rel="manifest" href="manifest.webmanifest"><title>FootLive — Football</title>
<style>
:root{color-scheme:dark;--bg:#100b1b;--panel:#1b1428;--panel2:#261a37;--muted:#a99bbd;--line:#39284e;--lime:#d86bff;--white:#fbf7ff;--blue:#9b70ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#43215e 0,#160e23 42%,#0d0915 100%);color:var(--white);font:15px system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:92px}.wrap{max-width:760px;margin:auto;padding:18px 15px}.top{display:flex;align-items:center;justify-content:space-between;margin:3px 2px 18px}.brand{font-weight:950;letter-spacing:1.8px;font-size:23px}.brand span{color:var(--lime)}.season{font-size:10px;color:#e2c9f4;border:1px solid var(--line);border-radius:20px;padding:7px 10px}.hero{background:linear-gradient(135deg,#39204e,#21152f 65%,#171020);border:1px solid #2b4262;border-radius:22px;padding:19px;margin-bottom:17px;box-shadow:0 14px 35px #0003}.eyebrow{font-size:10px;letter-spacing:1.7px;color:var(--lime);font-weight:850}.hero h1{font-size:26px;line-height:1.12;margin:7px 0}.hero p{color:#aebbd0;margin:0;font-size:13px;line-height:1.45}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}.sectionhead h2{font-size:17px;margin:0}.muted{color:var(--muted);font-size:11px}.pills{display:flex;gap:8px;overflow:auto;padding:2px 0 12px;scrollbar-width:none}.pill{white-space:nowrap;border:1px solid var(--line);background:#21172e;color:#e0d4eb;padding:9px 14px;border-radius:22px;font-size:12px;font-weight:700}.pill.active{background:linear-gradient(135deg,#e879ff,#9e65ff);border-color:#e879ff;color:#170d20;box-shadow:0 5px 18px #bd4cff55}.feature{background:linear-gradient(145deg,#291a3b,#1a1226);border:1px solid #2a3b55;border-radius:17px;padding:14px;margin:9px 0}.scorer{display:grid;grid-template-columns:28px 42px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 5px;border-bottom:1px solid #39284e}.scorer:last-child{border-bottom:0}.rank{font-size:13px;color:#9cacc2;font-weight:800;text-align:center}.rank.top{color:var(--lime)}.crest{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,var(--c1),var(--c2));border:1px solid #ffffff30;display:grid;place-items:center;box-shadow:inset 0 1px 5px #ffffff25,0 4px 10px #0004;position:relative;overflow:hidden}.crest:before{content:"";position:absolute;inset:4px;border:1px solid #ffffff60;border-radius:9px;transform:rotate(8deg)}.crest b{position:relative;font-size:11px;letter-spacing:-.4px;color:#fff;text-shadow:0 1px 3px #0008}.player{font-weight:800;font-size:13px}.club{font-size:11px;color:#9eacc1;margin-top:3px}.goals{text-align:right;min-width:48px}.goals strong{display:block;font-size:22px;line-height:1;color:var(--lime)}.goals span{font-size:9px;letter-spacing:1px;color:#9eacc1}.meta{display:flex;gap:8px;align-items:center;margin-top:5px}.tag{font-size:9px;color:#c5d2e5;background:#39264d;padding:4px 7px;border-radius:6px}.table{background:#1b1428;border:1px solid var(--line);border-radius:16px;overflow:hidden}.tr{display:grid;grid-template-columns:28px 40px minmax(0,1fr) 35px 45px;gap:8px;align-items:center;padding:11px 12px;border-bottom:1px solid #39284e;font-size:11px}.tr:last-child{border:0}.tr.head{color:#8798b1;font-size:9px;text-transform:uppercase;letter-spacing:.6px;background:#2a1b3b}.mini-crest{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:9px;font-weight:900;color:white;background:linear-gradient(145deg,var(--c1),var(--c2));border:1px solid #ffffff30}.clubname{font-size:12px;font-weight:750}.pts{color:var(--lime);font-weight:900;text-align:right}.match{background:#1b1428;border:1px solid var(--line);border-radius:15px;padding:14px;margin:9px 0}.matchtop{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-bottom:13px}.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}.team{font-weight:750;font-size:12px}.team:last-child{text-align:right}.score{font-size:20px;font-weight:950;letter-spacing:1px}.note{border-left:3px solid #e7b85a;padding:9px 11px;color:#aebbd0;font-size:10px;line-height:1.45;margin:14px 2px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#160f21ed;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 3px calc(8px + env(safe-area-inset-bottom));z-index:5}.tab{border:0;background:none;color:#8190a8;font-size:9px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:48px;flex:1}.tab b{font-size:19px;font-weight:500}.tab.active{color:#e879ff}.tab.active b{transform:translateY(-2px)}.foot{font-size:10px;color:#71819a;text-align:center;margin:15px 0 0}.hidden{display:none}
.portrait{width:42px;height:42px;object-fit:cover;object-position:center 22%;border-radius:14px;border:1px solid #f0b5ff88;box-shadow:0 0 18px #bd4cff55}.hero{box-shadow:0 16px 45px #0007,0 0 28px #a33dce18}.feature,.match,.table{box-shadow:0 12px 30px #0005}.crest,.mini-crest{box-shadow:0 0 16px #b84fff24,inset 0 1px 5px #ffffff25}.scorer{border-radius:14px;margin:4px 0;padding:12px 7px;background:#ffffff04}.scorer:last-child{border:0}.tabs{border-top:1px solid #4a3260;box-shadow:0 -8px 25px #0005}.tab.active{color:#e879ff}.tab.active b{filter:drop-shadow(0 0 8px #dc70ff)}.note{border-left-color:#d86bff;background:#241731;border-radius:0 10px 10px 0;padding:11px 13px}</style></head><body><main class="wrap"><header class="top"><div class="brand">FOOT<span>LIVE</span></div><div class="season">SAISON 2026–2027</div></header><div id="app"></div><div class="foot" id="data-status">Connexion aux données officielles…</div></main>
<nav class="tabs"><button class="tab active" data-tab="home"><b>⌂</b>Accueil</button><button class="tab" data-tab="results"><b>◷</b>Résultats</button><button class="tab" data-tab="next"><b>▹</b>À venir</button><button class="tab" data-tab="standings"><b>☷</b>Classements</button><button class="tab" data-tab="scorers"><b>⚽</b>Buteurs</button></nav>
<script>
const API_TTL={live:30*60*1000,standings:24*60*60*1000,scorers:24*60*60*1000,next:24*60*60*1000,results:24*60*60*1000};
const apiStore={live:[],standings:{},scorers:{},next:{},results:{}};
async function apiGet(type,competition){
 const key=`footlive_${type}_${competition||'all'}`, ttl=API_TTL[type];
 try { const saved=JSON.parse(localStorage.getItem(key)||'null'); if(saved&&Date.now()-saved.at<ttl)return saved.data; } catch(e){}
 const url=`/.netlify/functions/football?type=${type}`+(competition?`&comp=${competition}`:'');
 const response=await fetch(url); const data=await response.json();
 if(!response.ok||data.error) throw new Error(data.message||data.error||'Erreur API');
 try{localStorage.setItem(key,JSON.stringify({at:Date.now(),data}));}catch(e){}
 return data;
}
function teamLogo(team){return team?.logo?`<img src="${team.logo}" alt="" style="width:30px;height:30px;object-fit:contain;vertical-align:middle">`:''}
function apiMatch(f){const h=f.teams?.home||{},a=f.teams?.away||{},g=f.goals||{},st=f.fixture?.status||{};const done=['FT','AET','PEN'].includes(st.short);const live=['1H','HT','2H','ET','P','LIVE'].includes(st.short);return `<article class="match"><div class="matchtop"><span>${new Date(f.fixture.date).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</span><span>${live?'🔴 EN DIRECT':done?'TERMINÉ':st.long||'À VENIR'}</span></div><div class="teams"><div class="team">${teamLogo(h)} ${h.name||'—'}</div><div class="score">${g.home??'—'} : ${g.away??'—'}</div><div class="team">${teamLogo(a)} ${a.name||'—'}</div></div></article>`}
async function refreshData(){
 const status=document.getElementById('data-status');
 try{const live=await apiGet('live');apiStore.live=live.response||[];if(status)status.textContent=`Données API-Football · ${live._quota?.remaining??'—'} requêtes restantes aujourd’hui · actualisation toutes les 30 min`;
   for(const c of comps){for(const type of ['standings','scorers','next','results']){try{apiStore[type][c.id]=await apiGet(type,c.id)}catch(e){console.warn(type,c.id,e.message)}}}
   const active=document.querySelector('.tab.active')?.dataset.tab||'home';render(active);
 }catch(e){if(status)status.textContent=e.message.includes('API_FOOTBALL_KEY')?'Clé API à configurer dans Netlify':'Données momentanément indisponibles · réessaie plus tard';console.warn(e)}
}
setInterval(async()=>{if(document.visibilityState!=='visible')return;try{const d=await apiGet('live');apiStore.live=d.response||[];const t=document.querySelector('.tab.active')?.dataset.tab;if(t==='home'||t==='results')render(t)}catch(e){console.warn('Actualisation live:',e.message)}},30*60*1000);
const comps=[{id:'l1',name:'Ligue 1',short:'L1',flag:'🇫🇷'},{id:'ucl',name:'Ligue des champions',short:'LDC',flag:'⭐'},{id:'uel',name:'Europa League',short:'UEL',flag:'🌍'}];
const colors={PSG:['#153c78','#d92345'],OM:['#3a9bdc','#f2f7ff'],OL:['#153c78','#df263b'],ASM:['#d7193f','#fff'],LOSC:['#d7193f','#153c78'],RCL:['#d7193f','#f4c64e'],RMA:['#d6d9e0','#5367a4'],BAR:['#173d8c','#a51c43'],LIV:['#b51f2e','#e5c35b'],BAY:['#c51e32','#fff'],ARS:['#b51f32','#fff'],ROM:['#a51e2b','#e8b64c'],POR:['#174d9b','#b91c32'],BET:['#16834c','#fff'],NCE:['#171717','#d92345']};
const crest=(code,mini=false)=>`<span class="${mini?'mini-crest':'crest'}" style="--c1:${(colors[code]||['#405a7c','#9aabc0'])[0]};--c2:${(colors[code]||['#405a7c','#9aabc0'])[1]}"><b>${code}</b></span>`;

let comp='l1';
function header(k,t,p){return `<section class="hero"><div class="eyebrow">${k}</div><h1>${t}</h1><p>${p}</p></section>`}
function pills(){return `<div class="pills">${comps.map(c=>`<button class="pill ${comp===c.id?'active':''}" onclick="setComp('${c.id}')">${c.flag} ${c.name}</button>`).join('')}</div>`}
function scorers(){let liveRows=apiStore.scorers[comp]?.response||[];let rows=liveRows.length?liveRows.map((x,i)=>[String(i+1),x.player?.name||'Joueur',x.statistics?.[0]?.team?.name||'',x.statistics?.[0]?.team?.name||'',String(x.statistics?.[0]?.goals?.total??0),String(x.statistics?.[0]?.goals?.assists??0),x.player?.photo]):[];return header('LES STATS OFFENSIVES','Classement des buteurs',`Les meilleurs réalisateurs · ${comps.find(c=>c.id===comp).name}`)+pills()+`<div class="sectionhead"><h2>Top buteurs</h2><span class="muted">Buts · Passes décisives</span></div><section class="feature">${rows.length?rows.map((r,i)=>`<div class="scorer"><div class="rank ${i<3?'top':''}">${r[0]}</div>${r[6]?`<img class="portrait" src="${r[6]}" alt="">`:crest(r[2])}<div><div class="player">${r[1]}</div><div class="club">${r[3]}</div><div class="meta"><span class="tag">${r[5]} passes D.</span><span class="tag">Saison 26/27</span></div></div><div class="goals"><strong>${r[4]}</strong><span>BUTS</span></div></div>`).join(''):'<div class="note">Aucun buteur retourné pour cette compétition/saison.</div>'}</section><div class="note">${liveRows.length?'Statistiques officielles fournies par API-Football.':'Aucune donnée officielle disponible pour le moment.'}</div>`}
function standings(){let raw=apiStore.standings[comp]?.response?.[0]?.league?.standings?.[0]||[];let rows=raw.map(x=>[String(x.rank),x.team?.name||'',x.team?.code||'',String(x.points??0),x.team?.logo]);return header('LES CLASSEMENTS','Classement général',`La hiérarchie de la compétition · ${comps.find(c=>c.id===comp).name}`)+pills()+`<div class="sectionhead"><h2>Top du classement</h2><span class="muted">Pts · aperçu</span></div><div class="table"><div class="tr head"><span>#</span><span></span><span>Club</span><span></span><span>Pts</span></div>${rows.length?rows.map((r,i)=>`<div class="tr"><b>${r[0]}</b>${r[4]?`<img src="${r[4]}" style="width:28px;height:28px;object-fit:contain" alt="">`:crest(r[2],true)}<span class="clubname">${r[1]}</span><span></span><b class="pts">${r[3]}</b></div>`).join(''):'<div class="note">Aucun classement retourné pour cette compétition/saison. Vérifie sa disponibilité dans ton forfait API-Football.</div>'}</div><div class="note">${raw.length?'Classement officiel API-Football.':'Aucune donnée officielle disponible pour le moment.'}</div>`}
function match(date,a,b,score){return `<article class="match"><div class="matchtop"><span>${date} · ${comps.find(c=>c.id===comp).name}</span><span>${score?'TERMINÉ':'À VENIR'}</span></div><div class="teams"><div class="team">${a}</div><div class="score">${score||'— : —'}</div><div class="team">${b}</div></div></article>`}
function render(tab){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));let a=document.getElementById('app');if(tab==='scorers')a.innerHTML=scorers();else if(tab==='standings')a.innerHTML=standings();else if(tab==='results')a.innerHTML=header('LES SCORES','Résultats','Retrouve les dernières rencontres terminées.')+pills()+((apiStore.results[comp]?.response||[]).map(apiMatch).join('')||'<div class="note">Résultats officiels indisponibles pour le moment.</div>');else if(tab==='next')a.innerHTML=header('LE CALENDRIER','Prochains matchs','Les prochaines affiches à ne pas manquer.')+pills()+((apiStore.next[comp]?.response||[]).map(apiMatch).join('')||'<div class="note">Calendrier officiel indisponible pour le moment.</div>');else a.innerHTML=header('FOOTBALL · 3 COMPÉTITIONS','Tout le foot, au même endroit','Résultats, calendrier, classements et buteurs dans une seule application.')+`<div class="sectionhead"><h2>Choisir une compétition</h2></div>${pills()}<section class="feature"><div class="eyebrow">À LA UNE</div><h2 style="margin:7px 0 4px">Les classements et les buteurs</h2><p class="muted">Retrouve les performances des clubs et des joueurs en quelques secondes.</p><div class="pills" style="margin-top:13px"><button class="pill active" onclick="render('standings')">Voir les classements</button><button class="pill" onclick="render('scorers')">Voir les buteurs</button></div></section><div class="sectionhead"><h2>Matchs à suivre</h2><span class="muted">Scores en direct</span></div>${(apiStore.live||[]).filter(x=>[61,2,3].includes(x.league?.id)).map(apiMatch).join('')||'<div class="note">Aucun match en direct pour ces compétitions actuellement.</div>'}`}
function setComp(id){comp=id;let active=document.querySelector('.tab.active')?.dataset.tab||'scorers';if(active!=='scorers'&&active!=='standings')active='scorers';render(active)}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>render(b.dataset.tab)));render('home');refreshData();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
